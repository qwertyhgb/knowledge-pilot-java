server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: knowledge-pilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Boot 4 使用 Jackson 3（tools.jackson），日期开关已从 SerializationFeature 移到 DateTimeFeature
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

  # 库表由 src/main/resources/db 下的脚本手工执行，应用启动不自动建表
  sql:
    init:
      mode: never

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: knowledge-pilot-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 17400000
      keepalive-time: 300000
      validation-timeout: 5000
      connection-test-query: SELECT 1

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledgepilot.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.knowledgepilot.controller
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    description: '@project.description@'

logging:
  level:
    root: INFO
    com.knowledgepilot: DEBUG
    com.zaxxer.hikari: INFO
